name: 每日学科新闻早报

on:
  schedule:
    # 每天北京时间 8:00 执行（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 发送学科新闻简报
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          # 工科新闻源
          ENGINEERING_FEEDS=(
            "https://www.jiqizhixin.com/rss"
            "https://www.qbitai.com/feed"
            "https://www.36kr.com/feed"
          )
          
          # 理科新闻源
          SCIENCE_FEEDS=(
            "https://news.sciencenet.cn/index.php?mod=rss"
            "https://www.phys.org/rss-feed/"
          )
          
          # 文科新闻源
          ARTS_FEEDS=(
            "https://www.thepaper.cn/rss_27884.xml"
            "http://www.cssn.cn/rss/"
          )
          
          # 医科新闻源
          MEDICAL_FEEDS=(
            "https://www.dxy.cn/rss/bbs.xml"
            "http://www.jkb.com.cn/rss"
          )
          
          # 这里需要安装 curl 来获取 RSS 内容
          sudo apt-get update
          sudo apt-get install -y curl
          
          # 构建推送消息
          MESSAGE="## 📚 每日学科新闻早报 ($(date '+%Y年%m月%d日'))\n\n"
          
          # 工科部分
          MESSAGE="${MESSAGE}### 🔧 工科前沿\n"
          for feed in "${ENGINEERING_FEEDS[@]}"; do
            NEWS=$(curl -s "$feed" | grep -o '<title>[^<]*</title>' | head -5 | sed 's/<title>//g' | sed 's/<\/title>//g' | sed 's/^/- /')
            if [ -n "$NEWS" ]; then
              MESSAGE="${MESSAGE}${NEWS}\n"
            fi
          done
          MESSAGE="${MESSAGE}\n"
          
          # 理科部分
          MESSAGE="${MESSAGE}### 🔬 理科前沿\n"
          for feed in "${SCIENCE_FEEDS[@]}"; do
            NEWS=$(curl -s "$feed" | grep -o '<title>[^<]*</title>' | head -5 | sed 's/<title>//g' | sed 's/<\/title>//g' | sed 's/^/- /')
            if [ -n "$NEWS" ]; then
              MESSAGE="${MESSAGE}${NEWS}\n"
            fi
          done
          MESSAGE="${MESSAGE}\n"
          
          # 文科部分
          MESSAGE="${MESSAGE}### 📖 文科动态\n"
          for feed in "${ARTS_FEEDS[@]}"; do
            NEWS=$(curl -s "$feed" | grep -o '<title>[^<]*</title>' | head -5 | sed 's/<title>//g' | sed 's/<\/title>//g' | sed 's/^/- /')
            if [ -n "$NEWS" ]; then
              MESSAGE="${MESSAGE}${NEWS}\n"
            fi
          done
          MESSAGE="${MESSAGE}\n"
          
          # 医科部分
          MESSAGE="${MESSAGE}### 💊 医学进展\n"
          for feed in "${MEDICAL_FEEDS[@]}"; do
            NEWS=$(curl -s "$feed" | grep -o '<title>[^<]*</title>' | head -5 | sed 's/<title>//g' | sed 's/<\/title>//g' | sed 's/^/- /')
            if [ -n "$NEWS" ]; then
              MESSAGE="${MESSAGE}${NEWS}\n"
            fi
          done
          
          MESSAGE="${MESSAGE}\n> 本早报由自动程序生成，仅供内部参考"
          
          # 发送到企业微信
          curl -X POST "$WECHAT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"$MESSAGE\"}}"
