name: 每日学科新闻早报

on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: 发送学科新闻简报
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: |
          MESSAGE="## 📚 每日学科新闻早报（2026-03-29）\n\n"
          
          MESSAGE="${MESSAGE}### 🔬 理工科前沿\n"
          SCIENCENET=$(curl -s "https://news.sciencenet.cn/index.php?mod=rss" | grep -o '<title>[^<]*</title>' | head -3 | sed 's/<title>//g;s/<\/title>//g')
          MESSAGE="${MESSAGE}${SCIENCENET}\n\n"
          
          MESSAGE="${MESSAGE}---\n> 测试版早报"
          
          curl -X POST "$WECHAT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"$MESSAGE\"}}"
